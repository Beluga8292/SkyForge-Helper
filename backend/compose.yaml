name: skyblock-companion

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skyblock}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-skyblock}
  REDIS_URL: redis://redis:6379/0
  HYPIXEL_API_KEY: ${HYPIXEL_API_KEY:?set HYPIXEL_API_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-["tauri://localhost","https://tauri.localhost"]}
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-[]}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
  WORKER_HEARTBEAT_PATH: /tmp/worker-heartbeat
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skyblock}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skyblock} -d ${POSTGRES_DB:-skyblock}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Never publish PostgreSQL to the internet.
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Never publish Redis to the internet.
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    ports:
      # Bind to loopback only; a TLS reverse proxy (Caddy/Nginx) publishes 443.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health'))['status'])"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    command: ["python", "-m", "app.workers.main"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; assert time.time()-Path('/tmp/worker-heartbeat').stat().st_mtime < 60"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"

volumes:
  postgres-data:
  redis-data:
