name: SkyForge Helper compatibility installers (artifacts only)
on:
  workflow_dispatch:
    inputs:
      validate_updater_windows:
        description: Actual shipped rc.5 native updater GUI to public rc.6 (no rebuild)
        required: false
        default: false
        type: boolean
      validate_existing_windows:
        description: Install rc.6 over published rc.5 on disposable Windows (no rebuild; NOT updater E2E)
        required: false
        default: false
        type: boolean
      backend_url:
        description: Public HTTPS backend URL (no credentials)
        required: true
        default: https://updates.plasmavpn.online/sbc
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: inputs.validate_existing_windows != true && inputs.validate_updater_windows != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: macos-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            # MSI/WiX rejects the non-numeric `rc.5` pre-release version, so NSIS
            # is the validated Windows package for this pre-release line.
            bundles: nsis
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VITE_BACKEND_URL: ${{ inputs.backend_url }}
      VITE_RELEASE_CANDIDATE: 'true'
      SFH_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: python scripts/audit-publication.py
      - run: node scripts/check-readme.mjs
      - run: node scripts/prepare-ci-build.mjs
      - run: node scripts/build-compat-native.mjs ${{ matrix.bundles }}
      - name: Collect validated non-release artifacts
        run: python scripts/package-ci-artifacts.py
      - name: Windows signature status (not signing)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem artifacts | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            Write-Output "$($_.Name): $($s.Status)"
          }
      - name: Windows clean install, launch, data and uninstall smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'artifacts/SkyForge-Helper-Setup-x64.exe').Path
          Write-Output "Running silent per-user install: $installer"
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait

          $installDir = Join-Path $env:LOCALAPPDATA 'SkyBlock Companion'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $installDir); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $installDir)) { throw "Install directory not found: $installDir" }
          if (-not $installDir.StartsWith($env:LOCALAPPDATA, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Installer is not per-user: $installDir"
          }
          $exe = Get-ChildItem $installDir -Filter '*.exe' |
            Where-Object { $_.Name -notlike 'uninstall*' } |
            Select-Object -First 1
          if (-not $exe) { throw 'Application executable missing after install' }
          Write-Output "Installed executable: $($exe.FullName)"

          $shortcuts = Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter '*.lnk' |
            Where-Object { $_.Name -match 'SkyBlock|SkyForge' }
          if (-not $shortcuts) { throw 'Start Menu shortcut not created' }
          Write-Output "Start Menu shortcut: $($shortcuts[0].FullName)"

          $db = Join-Path $env:APPDATA 'com.skyblock.companion\skyblock-companion.sqlite3'
          Remove-Item $db -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe.FullName -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $db); $i++) {
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw "App exited during first launch with code $($process.ExitCode)" }
          }
          if (-not (Test-Path $db)) { throw "SQLite database not created at $db" }
          python scripts/windows-smoke-sqlite.py set $db
          if ($LASTEXITCODE -ne 0) { throw 'Failed to write smoke settings row' }
          Write-Output "SQLite created at expected per-user path; startup PASS"
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "App exited after startup with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 3

          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller missing' }
          Write-Output 'Running silent uninstall'
          Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $installDir); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $installDir) { throw "Install directory still present after uninstall: $installDir" }
          if (-not (Test-Path $db)) { throw 'Uninstall removed user data unexpectedly' }
          python scripts/windows-smoke-sqlite.py get $db
          if ($LASTEXITCODE -ne 0) { throw 'User settings did not survive uninstall' }
          Write-Output 'Uninstall removed the app while preserving user SQLite data PASS'
      - name: macOS app and DMG summary
        if: runner.os == 'macOS'
        run: |
          shasum -a 256 artifacts/*
          hdiutil imageinfo artifacts/SkyForge-Helper-macOS-arm64.dmg | grep -E 'Format|Class Name|Total Bytes' || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SkyForge-Helper-${{ matrix.platform }}-compat-dev-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/*

  windows-install-over:
    if: inputs.validate_existing_windows == true && github.repository == 'Beluga8292/SkyForge-Helper'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: updater-unsigned-x86_64-pc-windows-msvc-f64ccaf83d568a53af4b534ab5428a4b38e5892e
          path: candidate
          run-id: 41810475029
          github-token: ${{ github.token }}
      - name: Existing binary install-over compatibility (NOT updater E2E)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'Disposable runner only' }
          $dir = Join-Path $env:LOCALAPPDATA 'SkyBlock Companion'
          $db = Join-Path $env:APPDATA 'com.skyblock.companion\skyblock-companion.sqlite3'
          if ((Test-Path $dir) -or (Test-Path $db)) { throw 'Refusing pre-existing installation or data' }
          Invoke-WebRequest 'https://github.com/Beluga8292/SkyForge-Helper/releases/download/v0.5.0-rc.5-installers/SkyForge-Helper-Setup-x64.exe' -OutFile old-setup.exe
          if ((Get-FileHash old-setup.exe -Algorithm SHA256).Hash.ToLower() -ne '07ec526a7b2ae37dd60a7a9eaafc579344c3831d8283977bc5e32f6c18fb892d') { throw 'Published rc.5 checksum mismatch' }
          $setup = (Get-Item 'candidate/*-setup.exe').FullName
          if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne '7cd25aebb332b98c246d5cf5df0e44bd28ffc29ad6bbc9a3710ed4e5911d1045') { throw 'Verified rc.6 checksum mismatch' }
          Start-Process (Resolve-Path old-setup.exe) -ArgumentList '/S' -Wait
          $exe = Join-Path $dir 'skyblock-companion.exe'
          function Start-CheckedApp($version) {
            if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$version*") { throw 'Unexpected installed version' }
            $p = Start-Process $exe -PassThru
            for ($i=0; $i -lt 60 -and -not (Test-Path $db); $i++) { Start-Sleep 2; $p.Refresh(); if ($p.HasExited) { throw 'App exited' } }
            if (-not (Test-Path $db)) { throw 'Database missing' }
            Start-Sleep 5
            $p.Refresh(); if ($p.HasExited) { throw 'App exited after startup' }
            Stop-Process -Id $p.Id -Force
            Start-Sleep 3
          }
          Start-CheckedApp '0.5.0-rc.5'
          python scripts/windows-smoke-sqlite.py seed-upgrade $db
          if ($LASTEXITCODE -ne 0) { throw 'Fixture setup failed' }
          Start-Process $setup -ArgumentList '/S' -Wait
          Start-CheckedApp '0.5.0-rc.6'
          python scripts/windows-smoke-sqlite.py verify-upgrade $db
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade lost fixture data' }
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          for ($i=0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 2 }
          if (Test-Path $exe) { throw 'Uninstall failed' }
          python scripts/windows-smoke-sqlite.py verify-upgrade $db
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall lost fixture data' }
          Write-Output 'RC.5 TO RC.6 INSTALL-OVER / RESTART / FIXTURE ACCOUNT-SETTINGS-WATCHLIST / SQLITE / UNINSTALL PASS; NOT UPDATER E2E'

  windows-native-updater:
    if: inputs.validate_updater_windows == true && github.repository == 'Beluga8292/SkyForge-Helper'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Actual shipped Tauri updater and state retention
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Environment]::SetEnvironmentVariable('WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', '--remote-debugging-port=9222', 'User')
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $dir = Join-Path $env:LOCALAPPDATA 'SkyBlock Companion'
          $exe = Join-Path $dir 'skyblock-companion.exe'
          $db = Join-Path $env:APPDATA 'com.skyblock.companion\skyblock-companion.sqlite3'
          if ((Test-Path $dir) -or (Test-Path $db)) { throw 'Disposable empty runner required' }
          $manifest = Invoke-RestMethod 'https://updates.plasmavpn.online/sbc/updates/latest.json'
          if ($manifest.version -ne '0.5.0-rc.6') { throw 'Expected approved rc.6 bridge' }
          Invoke-WebRequest 'https://github.com/Beluga8292/SkyForge-Helper/releases/download/v0.5.0-rc.5-installers/SkyForge-Helper-Setup-x64.exe' -OutFile old-setup.exe
          if ((Get-FileHash old-setup.exe -Algorithm SHA256).Hash.ToLower() -ne '07ec526a7b2ae37dd60a7a9eaafc579344c3831d8283977bc5e32f6c18fb892d') { throw 'Published rc.5 checksum mismatch' }
          Start-Process (Resolve-Path old-setup.exe) -ArgumentList '/S' -Wait
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike '0.5.0-rc.5*') { throw 'Expected rc.5' }
          $p = Start-Process $exe -PassThru
          for ($i=0; $i -lt 60 -and -not (Test-Path $db); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $db)) { throw 'SQLite missing' }
          $ready = "import sqlite3,pathlib,sys; c=sqlite3.connect(pathlib.Path(sys.argv[1]).as_uri()+'?mode=ro',uri=True); names={r[0] for r in c.execute('SELECT name FROM sqlite_master')}; sys.exit(0 if {'settings','cache','watchlist','market_history'}<=names else 1)"
          for ($i=0; $i -lt 30; $i++) { python -c $ready $db; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap schema not ready' }
          Start-Sleep 3
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          python scripts/windows-smoke-sqlite.py seed-upgrade $db
          if ($LASTEXITCODE -ne 0) { throw 'Fixture setup failed' }
          node scripts/windows-updater-e2e.mjs $exe
          $nativeExit = $LASTEXITCODE
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $exe })
          Write-Output "POST-UPDATER VERSION: $version; APP PROCESS COUNT: $($running.Count)"
          @{version=$version; appProcessCount=$running.Count; controllerExit=$nativeExit} | ConvertTo-Json | Set-Content artifacts/updater-e2e/post-install-diagnostic.json
          if ($nativeExit -ne 0) {
            try {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $pwd 'artifacts/updater-e2e/runner-failure.png'))
              $graphics.Dispose(); $bitmap.Dispose()
            } catch { Write-Output 'Runner desktop screenshot unavailable' }
            throw 'Native updater controller failed; inspect post-install diagnostics'
          }
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike '0.5.0-rc.6*') { throw 'Expected installed rc.6' }
          $apps = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $exe }
          if (-not $apps) { throw 'Native restart did not leave rc.6 running' }
          $apps | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep 3
          python scripts/windows-smoke-sqlite.py verify-upgrade $db
          if ($LASTEXITCODE -ne 0) { throw 'Native update lost fixture data' }
          Write-Output 'WINDOWS NATIVE TAURI UPDATER RC.5 TO RC.6 / SQLITE / ACCOUNT-SETTINGS-WATCHLIST FIXTURE PASS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-native-updater-e2e-${{ github.sha }}
          path: artifacts/updater-e2e/*
          if-no-files-found: warn
          retention-days: 14
