name: SkyForge Helper CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/run-gitleaks.py
      - run: npm ci
      - run: node scripts/check-readme.mjs
      - run: python3 scripts/audit-publication.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock backend/requirements-ci.lock
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      HYPIXEL_API_KEY: ''
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.lock
      - run: python -m pip install -r backend/requirements-ci.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m pip check
      - run: python -m pytest backend/tests -q
  rust:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
