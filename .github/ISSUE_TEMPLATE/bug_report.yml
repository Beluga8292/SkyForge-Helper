name: Bug report
description: Report a reproducible problem with SkyForge Helper
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SkyForge Helper.

        **Do not include API keys, tokens, passwords, full UUIDs, balances, private profile data or database files.** Redact screenshots before uploading. Security problems belong in [SECURITY.md](https://github.com/Beluga8292/SkyForge-Helper/blob/main/SECURITY.md), not in a public issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app or in the installer file name.
      placeholder: 0.5.0-rc.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10 x64
        - Windows 11 x64
        - macOS 12+ Apple silicon
        - Built from source
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
      placeholder: I opened the Bazaar page and...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Remove secrets, tokens, full UUIDs, balances and personal data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed API keys, tokens, full UUIDs, balances and private data from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
